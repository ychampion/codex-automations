name: Inspect Cloudflare unified CLI

on:
  push:
    branches:
      - ops/inspect-cf-cli
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect packaged authentication implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cf-package"
          cd "$RUNNER_TEMP/cf-package"
          npm pack cf@0.8.0 --silent
          tar -xzf cf-0.8.0.tgz
          echo '=== package files ==='
          find package -maxdepth 3 -type f | sort | sed -n '1,240p'
          echo '=== device references ==='
          grep -RInE 'device[_ -]?flow|device/auth|device_code|--device|getOauthTokenViaDeviceFlow' package | head -200 || true
          echo '=== OAuth/client/scope references ==='
          grep -RInE 'cbca97e7|auth login|scopes|OAuth' package/dist package/bin 2>/dev/null | head -300 || true
