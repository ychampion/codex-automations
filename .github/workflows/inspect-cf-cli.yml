name: Inspect Cloudflare unified CLI

on:
  push:
    branches:
      - ops/inspect-cf-cli
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect authentication chunks
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cf-package"
          rm -rf -- "$work"
          mkdir -p "$work"
          cd "$work"
          archive="$(npm pack cf@0.8.0 --silent)"
          tar -xzf "$archive"

          echo '=== relevant files and sizes ==='
          find package/dist -maxdepth 1 -type f \
            \( -name 'auth-*.mjs' -o -name 'oauth-*.mjs' -o -name 'cf-*.mjs' -o -name 'index.mjs' -o -name 'open-*.mjs' -o -name 'prompt-*.mjs' \) \
            -printf '%s\t%p\n' | sort -nr

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = 'package/dist';
          const selected = fs.readdirSync(directory)
            .filter((name) => /^(auth-|oauth-|cf-|open-|prompt-)|^index\.mjs$/.test(name))
            .map((name) => path.join(directory, name));

          const terms = [
            '/oauth2/device/auth',
            'device_code',
            'verification_uri',
            'oauth2/token',
            'cbca97e7-c331-4cdd-8fd8-e25a451b98bf',
            'auth login',
            'onLogin',
            'openBrowser',
            'authorization_code',
            'code_verifier',
            'scopes',
            'no-browser',
            'callback',
          ];

          function clips(text, term, radius = 1000, limit = 6) {
            const out = [];
            let start = 0;
            while (out.length < limit) {
              const index = text.indexOf(term, start);
              if (index < 0) break;
              out.push(text.slice(Math.max(0, index - radius), Math.min(text.length, index + term.length + radius)));
              start = index + term.length;
            }
            return out;
          }

          for (const file of selected) {
            const text = fs.readFileSync(file, 'utf8');
            const matches = terms.filter((term) => text.includes(term));
            console.log(`\n===== ${file} (${text.length} bytes) =====`);
            console.log(`matches=${matches.join(',') || '(none)'}`);
            if (!matches.length) {
              console.log(text.slice(0, 3000));
              continue;
            }
            for (const term of matches) {
              console.log(`\n--- ${term} ---`);
              for (const clip of clips(text, term)) console.log(clip);
            }
          }

          console.log('\n===== cross-package search =====');
          const all = fs.readdirSync(directory).filter((name) => name.endsWith('.mjs'));
          for (const term of terms) {
            const hits = [];
            for (const name of all) {
              const text = fs.readFileSync(path.join(directory, name), 'utf8');
              if (text.includes(term)) hits.push(name);
            }
            console.log(`${term}: ${hits.join(', ') || '(none)'}`);
          }
          NODE
